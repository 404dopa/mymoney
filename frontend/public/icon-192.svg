<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3bf0"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Credit Card / Wallet Shape -->
  <rect x="36" y="52" width="120" height="88" rx="16" fill="url(#cardGrad)" filter="url(#shadow)"/>
  
  <!-- Magnetic stripe / card accent -->
  <rect x="36" y="72" width="120" height="16" fill="#1e293b" opacity="0.6"/>
  
  <!-- Chip / Emblem -->
  <rect x="52" y="98" width="24" height="20" rx="5" fill="#facc15"/>
  <circle cx="64" cy="108" r="4" fill="#ca8a04"/>
  
  <!-- Currency Symbol / Arrow Accent -->
  <path d="M124 102 L140 102 M134 96 L140 102 L134 108" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="106" cy="108" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="108" r="6" fill="#ffffff" opacity="0.5"/>
</svg>
