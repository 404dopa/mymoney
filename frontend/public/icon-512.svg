<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3bf0"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Credit Card / Wallet Shape -->
  <rect x="96" y="138" width="320" height="236" rx="42" fill="url(#cardGrad512)" filter="url(#shadow512)"/>
  
  <!-- Magnetic stripe / card accent -->
  <rect x="96" y="192" width="320" height="42" fill="#1e293b" opacity="0.6"/>
  
  <!-- Chip / Emblem -->
  <rect x="138" y="262" width="64" height="54" rx="12" fill="#facc15"/>
  <circle cx="170" cy="289" r="10" fill="#ca8a04"/>
  
  <!-- Currency Symbol / Arrow Accent -->
  <path d="M330 274 L374 274 M358 258 L374 274 L358 290" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="282" cy="289" r="16" fill="#ffffff" opacity="0.8"/>
  <circle cx="320" cy="289" r="16" fill="#ffffff" opacity="0.5"/>
</svg>
