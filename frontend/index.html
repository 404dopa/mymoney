<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Money Track | تتبع الأموال</title>

    <!-- PWA & Mobile Standalone Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money Track" />
    <meta name="application-name" content="Money Track" />
    <meta name="theme-color" content="#1e2430" />
    <meta name="msapplication-navbutton-color" content="#1e2430" />
    <meta name="msapplication-TileColor" content="#1e2430" />

    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Google Font Cairo for Arabic clarity & high readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- iOS Standalone Link Trap & Gesture Zoom Lock -->
    <script>
      (function() {
        // 1. Prevent iOS Standalone Link Breakout
        if (('standalone' in window.navigator) && window.navigator.standalone) {
          window.addEventListener('load', function() {
            document.addEventListener('click', function(e) {
              var target = e.target;
              while (target && target.tagName !== 'A' && target !== document.body) {
                target = target.parentElement;
              }
              if (target && target.tagName === 'A') {
                var href = target.getAttribute('href');
                if (href && !href.startsWith('http://') && !href.startsWith('https://') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
                  e.preventDefault();
                  window.history.pushState(null, '', href);
                  window.dispatchEvent(new PopStateEvent('popstate'));
                }
              }
            }, false);
          });
        }

        // 2. Disable Pinch-to-Zoom (Two Fingers) completely on Safari / Chrome
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        // Multi-touch touchstart / touchmove (Pinch lock)
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // 3. Prevent Double-Tap Zoom
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          var target = e.target;
          var isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
          if (!isInput && (now - lastTouchEnd <= 300)) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });

        // 4. Prevent Trackpad / Ctrl + Wheel Zoom
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
